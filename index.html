function bindQuizCanvas(){
  const cv=document.getElementById("animCv");if(!cv)return;
  const ptOf=e=>{
    const r=cv.getBoundingClientRect();
    const p=rawP(e);
    return [Math.round((e.clientX-r.left)*10)/10,Math.round((e.clientY-r.top)*10)/10,Math.round(p*1000)/1000,tiltMagOf(e)];
  };
  cv.onpointerdown=e=>{
    if(animState.mode!=="quiz"||!quiz.geom||quiz.idx>=animState.strokes.length)return;
    if(quiz.live&&e.pointerId!==quiz.live.pid)return;
    if(e.pointerType==="pen"&&!GS.get("penSeen",false))GS.set("penSeen",true);
    const allow=e.pointerType==="pen"||e.pointerType==="mouse"||!S.penOnly||!GS.get("penSeen",false);
    if(!allow){if(e.pointerType==="touch"){quiz.msg="Dùng S Pen để tô · đang bật Chỉ nhận S Pen";quiz.msgKind="err";drawQuizFrame()}return}
    e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
    if(quiz.timer){clearTimeout(quiz.timer);quiz.timer=0}
    quiz.hint=null;quiz.failPts=null;quiz.failUntil=0;
    const q=ptOf(e);q[2]=Math.min(q[2],(S.pFull||.38)*.45);
    const col=themeName()==="dark"?"#82B4FF":themeName()==="eink"?"#333333":"#184E9E";
    const w=Math.max(2.8,Math.min(6.5,quiz.geom.xh*(SCRIPT!=="td"?0.11:0.085)));
    quiz.live={tp:SCRIPT==="td"?"fountain":"gel",c:col,w,pr:SCRIPT==="td",ct:"med",na:38,tl:false,pf:S.pFull||.38,p:[q],pid:e.pointerId};
    drawQuizFrame();
  };
  cv.onpointermove=e=>{
    if(!quiz.live||animState.mode!=="quiz"||e.pointerId!==quiz.live.pid)return;
    e.preventDefault();
    let evs=e.getCoalescedEvents?e.getCoalescedEvents():[];if(!evs.length)evs=[e];
    for(const ev of evs){
      const raw=ptOf(ev),p=quiz.live.p[quiz.live.p.length-1];
      if(Math.hypot(raw[0]-p[0],raw[1]-p[1])<1.2)continue;
      quiz.live.p.push([raw[0],raw[1],Math.round((p[2]*.38+raw[2]*.62)*1000)/1000,raw[3]]);
    }
    drawQuizFrame();
  };
  const endQuiz=e=>{
    if(!quiz.live||animState.mode!=="quiz"||(e&&e.pointerId!==quiz.live.pid))return;
    const stObj=quiz.live;quiz.live=null;
    const g=quiz.geom,target=animState.strokes[quiz.idx];
    if(!g||!target){drawQuizFrame();return}
    const uNorm=stObj.p.map(q=>[(q[0]-g.x0)/g.xh,(g.b-q[1])/g.xh]);
    const res=evalQuizStroke(uNorm,target);
    if(res.ok){
      quiz.idx++;quiz.misses=0;quiz.failPts=null;
      const total=animState.strokes.length;
      if(quiz.idx>=total){
        quiz.doneSet.add(animState.ch);updAnimChips();
        quiz.msg=`${charLabel(animState.ch)} · Hoàn thành (${total}/${total} nét) ✓`;quiz.msgKind="ok";
        renderAnimCtrl();
      }else{
        quiz.msg=`Đúng nét ${quiz.idx} ✓ · Tiếp nét ${quiz.idx+1}/${total}`;quiz.msgKind="ok";
      }
      drawQuizFrame();startQuizIdleLoop();
    }else{
      quiz.misses++;
      const n=quiz.idx+1;
      const msgs={
        start:`Đặt viết gần chấm xanh số ${n}`,
        dir:`Nét ${n} kéo ngược chiều — xem lại hướng mũi tên`,
        short:`Nét ${n} hơi ngắn — kéo hết theo bóng chữ`,
        far:`Nét ${n} hơi lệch mẫu — bám theo bóng chữ mờ`
      };
      quiz.msg=msgs[res.why]||msgs.far;quiz.msgKind="err";
      quiz.failPts=stObj.p.slice();quiz.failUntil=performance.now()+380;
      drawQuizFrame();startQuizIdleLoop();
      if(res.why==="dir"||quiz.misses>=2){
        if(quiz.timer)clearTimeout(quiz.timer);
        quiz.timer=setTimeout(()=>{quiz.timer=0;if(animState.mode==="quiz"&&document.getElementById("card").classList.contains("open"))quizShowHint()},340);
      }
    }
  };
  cv.onpointerup=endQuiz;cv.onpointercancel=endQuiz;
}

let animGlyph={},animLayerCv=null;
function animLayer(w,h){if(!animLayerCv)animLayerCv=document.createElement("canvas");if(animLayerCv.width!==w||animLayerCv.height!==h){animLayerCv.width=w;animLayerCv.height=h}return animLayerCv}
let lastAnimT=0;
function animLoop(ts){
  if(!animState.playing||animState.mode!=="watch"||!document.getElementById("card").classList.contains("open")){animRAF=0;return}
  if(!lastAnimT)lastAnimT=ts||performance.now();
  const now=ts||performance.now(),dt=Math.min(0.05,(now-lastAnimT)/1000);lastAnimT=now;
  animState.t=(animState.t||0)+dt;
  if(animState.t>animState.dur+ANIM_HOLD)animState.t=0;
  animState.progress=animProgressAt(animState.t);
  drawAnimFrame();
  animRAF=requestAnimationFrame(animLoop);
}

let demoS=[];
function demoInit(){const c=document.getElementById("demo");if(!c)return;const r=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,3);
  c.width=r.width*d;c.height=r.height*d;let s=null;
  const pt=ev=>{const br=c.getBoundingClientRect();return [ev.clientX-br.left,ev.clientY-br.top,rawP(ev),tiltMagOf(ev)]};
  c.onpointerdown=e=>{if(s&&e.pointerId!==s.pid)return;e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}
    const q=pt(e);q[2]=Math.min(q[2],(S.pFull||.38)*.45);
    s={tp:S.penType,c:S.color,w:S.width,pr:S.pressure,ct:S.contrast,na:S.nibAngle,tl:S.tiltOn,pf:S.pFull||.38,p:[q],pid:e.pointerId};

    demo()};

  const x=c.getContext("2d");x.setTransform(d,0,0,d,0,0);let last=null,evTimes=[];

    if(e.buttons){
      const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
      const now=performance.now();for(let k=0;k<evs.length;k++)evTimes.push(now);

  kq[kq.length - 1][1].push(...Object.keys(KHO_TRANG).filter(v => !da.has(v)));
  return kq.filter(([, ds]) => ds.length);
}

/* Khổ tự nhập: rộng × cao (mm), vẽ theo PX_MOI_MM */
function khoTuNhap(wMm, hMm) {

  return khoPdf({ ten: `Khổ ${w}×${h} mm`, wMm: w, hMm: h, pxW: Math.round(w * PX_MOI_MM), pxH: Math.round(h * PX_MOI_MM), barPx: 68, mono: false, links: true, moTa: `${w}×${h} mm · khổ tự nhập` });

let _pdfFonts=null;
function pdfFonts(){
  if(_pdfFonts)return _pdfFonts;
  const out={};
  for(const k in PDFF){const d=PDFF[k],cmap=new Map(),lig=new Map();
    for(const p of d.cm.split(",")){const i=p.indexOf(":");cmap.set(parseInt(p.slice(0,i),16),parseInt(p.slice(i+1),16))}
    for(const g in d.lg)lig.set(+g,d.lg[g]);
    out[k]=Object.assign({},d,{cmap,lig,adv:d.aw.split(",").map(v=>parseInt(v,16))});}
  return _pdfFonts=out;
}

let _pdfColCtx=null;const _pdfColCache=new Map();
function pdfColor(c){
  if(typeof c!=="string")return[0,0,0,1];
  let r=_pdfColCache.get(c);if(r)return r;
  if(!_pdfColCtx)_pdfColCtx=document.createElement("canvas").getContext("2d");
  const x=_pdfColCtx;x.fillStyle="#000";x.fillStyle=c;const v=String(x.fillStyle);
  if(v[0]==="#")r=[parseInt(v.slice(1,3),16)/255,parseInt(v.slice(3,5),16)/255,parseInt(v.slice(5,7),16)/255,1];
  else{const m=v.match(/[\d.]+/g)||[0,0,0];r=[m[0]/255,m[1]/255,m[2]/255,m[3]!=null?+m[3]:1]}
  _pdfColCache.set(c,r);return r;
}
class PdfDoc{
  constructor(){this.fonts=new Map();this.gs=new Map();this.st=new Map()}
  font(fam){let f=this.fonts.get(fam);if(!f){f={name:"F"+(this.fonts.size+1),fam,used:new Map()};this.fonts.set(fam,f)}return f}
  gsName(op,a){const k=op+a.toFixed(3);let g=this.gs.get(k);if(!g){g={name:"G"+(this.gs.size+1),op,a:+a.toFixed(3)};this.gs.set(k,g)}return g.name}

async function pdfDeflate(u8){
  try{if(typeof CompressionStream==="undefined")return null;
    const st=new Blob([u8]).stream().pipeThrough(new CompressionStream("deflate"));
    return new Uint8Array(await new Response(st).arrayBuffer())}catch(e){return null}
}
function pdfUtf16Hex(s){let h="";for(let i=0;i<s.length;i++)h+=s.charCodeAt(i).toString(16).padStart(4,"0").toUpperCase();return h}
function pdfB64(b64){const bin=atob(b64),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
/* Đóng gói PDF 1.4: phông TrueType nhúng (Type0/Identity-H, có bảng ToUnicode để chọn và tìm được chữ), độ trong suốt, liên kết mục lục */
async function assembleVectorPdf(doc,pages,ptW,ptH,W,H,title){
  const te=new TextEncoder(),chunks=[],offsets=[];let byteLen=0,nextId=1;
  const push=u=>{chunks.push(u);byteLen+=u.length};
  const pushStr=s=>push(te.encode(s));
  const alloc=()=>nextId++;
  const obj=(id,body)=>{offsets[id]=byteLen;pushStr(`${id} 0 obj\n${body}\nendobj\n`)};
  const stream=async(id,dict,u8,compress=true)=>{
    let data=u8,filt="";if(compress){const z=await pdfDeflate(u8);if(z&&z.length<u8.length){data=z;filt=" /Filter /FlateDecode"}}
    offsets[id]=byteLen;pushStr(`${id} 0 obj\n<< ${dict}${filt} /Length ${data.length} >>\nstream\n`);push(data);pushStr(`\nendstream\nendobj\n`)};
  push(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));
  const catId=alloc(),pagesId=alloc(),resId=alloc(),infoId=alloc();
  const pageIds=pages.map(()=>alloc());
  const FS=pdfFonts();
  /* Phông chữ */
  const fontRefs=[];let tagN=0;
  for(const f of doc.fonts.values()){
    const FD=FS[f.fam],t0=alloc(),cid=alloc(),fd=alloc(),ff=alloc(),tu=alloc();
    const tag="TVSPA"+String.fromCharCode(65+tagN++)+"+"+FD.ps,u=FD.upem,sc=v=>Math.round(v*1000/u);
    const gids=[...f.used.keys()].sort((a,b)=>a-b);
    const wArr=gids.map(g=>`${g} [${sc(FD.adv[g])}]`).join(" ");
    const zz=pdfB64(FD.z);
    offsets[ff]=byteLen;pushStr(`${ff} 0 obj\n<< /Length ${zz.length} /Length1 ${FD.len} /Filter /FlateDecode >>\nstream\n`);push(zz);pushStr(`\nendstream\nendobj\n`);
    obj(fd,`<< /Type /FontDescriptor /FontName /${tag} /Flags 4 /FontBBox [${FD.bb.map(sc).join(" ")}] /ItalicAngle ${FD.ia} /Ascent ${sc(FD.asc)} /Descent ${sc(FD.desc)} /CapHeight ${sc(FD.cap)} /StemV 80 /FontFile2 ${ff} 0 R >>`);
    obj(cid,`<< /Type /Font /Subtype /CIDFontType2 /BaseFont /${tag} /CIDSystemInfo << /Registry (Adobe) /Ordering (Identity) /Supplement 0 >> /FontDescriptor ${fd} 0 R /CIDToGIDMap /Identity /DW 1000 /W [${wArr}] >>`);
    let cm="/CIDInit /ProcSet findresource begin\n12 dict begin\nbegincmap\n/CIDSystemInfo << /Registry (Adobe) /Ordering (UCS) /Supplement 0 >> def\n/CMapName /Adobe-Identity-UCS def\n/CMapType 2 def\n1 begincodespacerange\n<0000> <FFFF>\nendcodespacerange\n";
    for(let i=0;i<gids.length;i+=100){const part=gids.slice(i,i+100);
      cm+=`${part.length} beginbfchar\n`+part.map(g=>`<${g.toString(16).padStart(4,"0")}> <${pdfUtf16Hex(f.used.get(g))}>`).join("\n")+"\nendbfchar\n"}
    cm+="endcmap\nCMapName currentdict /CMap defineresource pop\nend\nend";
    await stream(tu,"",te.encode(cm));
    obj(t0,`<< /Type /Font /Subtype /Type0 /BaseFont /${tag} /Encoding /Identity-H /DescendantFonts [${cid} 0 R] /ToUnicode ${tu} 0 R >>`);
    fontRefs.push(`/${f.name} ${t0} 0 R`);
  }
  /* Ký tự dự phòng dạng mặt nạ */
  const xRefs=[];
  for(const st of doc.st.values()){if(!st)continue;const id=alloc();
    await stream(id,`/Type /XObject /Subtype /Image /Width ${st.pw} /Height ${st.ph} /ImageMask true /BitsPerComponent 1`,st.bits);
    xRefs.push(`/${st.name} ${id} 0 R`)}
  const gsRefs=[...doc.gs.values()].map(g=>`/${g.name} << /Type /ExtGState /${g.op} ${g.a} >>`);
  obj(resId,`<< /ProcSet [/PDF /Text /ImageB] /Font << ${fontRefs.join(" ")} >> /ExtGState << ${gsRefs.join(" ")} >> /XObject << ${xRefs.join(" ")} >> >>`);
  /* Trang */
  const sx=ptW/W,sy=ptH/H;
  for(let i=0;i<pages.length;i++){const pg=pages[i],cId=alloc(),ann=[];
    for(const lk of (pg.links||[])){const aid=alloc();
      obj(aid,`<< /Type /Annot /Subtype /Link /Rect [${lk.rect.map(v=>v.toFixed(1)).join(" ")}] /Border [0 0 0] /Dest [${pageIds[lk.targetPage]} 0 R /Fit] >>`);ann.push(`${aid} 0 R`)}
    await stream(cId,"",te.encode(`q ${pdfN4(sx)} 0 0 ${pdfN4(-sy)} 0 ${pdfN4(ptH)} cm\n${pg.content}\nQ`));
    obj(pageIds[i],`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${ptW.toFixed(2)} ${ptH.toFixed(2)}] /Resources ${resId} 0 R /Contents ${cId} 0 R${ann.length?` /Annots [${ann.join(" ")}]`:""} >>`);
  }
  obj(pagesId,`<< /Type /Pages /Count ${pages.length} /Kids [${pageIds.map(id=>id+" 0 R").join(" ")}] >>`);
  obj(catId,`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  obj(infoId,`<< /Title <FEFF${pdfUtf16Hex(title||"Tập viết")}> /Creator <FEFF${pdfUtf16Hex("Tập viết S Pen "+APP_VER)}> /Producer (Tap viet S Pen ${APP_VER}) >>`);
  const xref=byteLen,n=nextId;
  let x=`xref\n0 ${n}\n0000000000 65535 f \n`;for(let i=1;i<n;i++)x+=String(offsets[i]||0).padStart(10,"0")+" 00000 n \n";
  pushStr(x+`trailer\n<< /Size ${n} /Root ${catId} 0 R /Info ${infoId} 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks,{type:"application/pdf"});
}

/* ================== exportPdf(cfg): XUẤT VỞ PDF TỪ MỘT GÓI CẤU HÌNH ==================
   Nhận một gói cấu hình cfg (docs/KIEN_TRUC.md mục 5.3), trả về file PDF. Không đọc bài đang mở,
   không đọc pdfOpt, không đụng giao diện: màn Xuất PDF, đường link cấu hình và GitHub Actions
   đều gọi chung hàm này.

   Còn một giới hạn: cfg.script phải trùng kiểu chữ app đang mở (SCRIPT), vì dữ liệu kiểu chữ
   được nạp một lần lúc khởi động. Muốn xuất kiểu khác thì đặt kiểu đó rồi tải lại trang.

   Dùng thử trong console:
     const r = await exportPdf({ script: SCRIPT, scope: "bai", lessons: ["n1"], preset: "a4" });
     r.blob, r.soTrang, r.tieuDe
*/
const TU_GO_TOI_DA = 2000;   // số ký tự tối đa của nội dung tự gõ (để đường link không quá dài)
const PDF_CFG_MAC_DINH = { v: 1, scope: "bai", lessons: [], mode: "to", grid: "french", arrows: true, preset: "rm2", barSide: "left" };

/* Kiểm và điền giá trị mặc định. Sai thì báo lỗi bằng lời dễ hiểu. */
function chuanHoaPdfCfg(cfg) {
  const c = Object.assign({}, PDF_CFG_MAC_DINH, cfg || {});
  if (c.v !== 1) throw new Error(`Không đọc được cấu hình phiên bản ${c.v}`);
  if (!c.script) c.script = SCRIPT;
  if (c.script !== SCRIPT) throw new Error(`Cấu hình dùng kiểu chữ "${c.script}" nhưng app đang mở kiểu "${SCRIPT}". Hãy đổi kiểu chữ rồi xuất lại.`);
  if (c.preset === "tunhap") khoTuNhap(c.wMm, c.hMm);   // báo lỗi nếu khổ tự nhập sai
  else if (!PDF_PRESETS[c.preset]) throw new Error(`Chưa có khổ giấy "${c.preset}"`);
  if (!["to", "nho"].includes(c.mode)) throw new Error(`Cách tập không hợp lệ: "${c.mode}"`);
  if (!["french", "oly4"].includes(c.grid)) throw new Error(`Kiểu dòng kẻ không hợp lệ: "${c.grid}"`);
  if (!["left", "right"].includes(c.barSide)) throw new Error(`Lề thanh công cụ không hợp lệ: "${c.barSide}"`);
  if (!["bai", "phan", "tatca", "luyenthem", "tudo", "tugo"].includes(c.scope))
    throw new Error(`Chưa hỗ trợ phạm vi "${c.scope}" (có: bai, phan, tatca, luyenthem, tudo, tugo)`);
  if (c.scope === "tugo") {
    c.text = typeof c.text === "string" ? c.text : "";
    if (!c.text.trim()) throw new Error("Chưa gõ nội dung để tập");
    if (c.text.length > TU_GO_TOI_DA) throw new Error(`Nội dung tự gõ dài quá ${TU_GO_TOI_DA} ký tự`);
  }
  c.arrows = c.arrows !== false;
  if (c.script === "th") c.grid = "oly4";   // Tiểu học luôn dùng lưới 4 ô li
  return c;
}

/* Chọn danh sách bài theo cfg. Phạm vi "luyenthem" dựng lại bài Luyện thêm / Bài ôn nên đổi vài biến
   chung; hàm gọi phải lưu và khôi phục các biến đó (exportPdf đã làm). */
function chonBaiPdf(c) {
  const timBai = id => {
    const l = LESSONS.find(x => x.id === id);
    if (!l) throw new Error(`Không có bài "${id}" trong giáo trình ${SC.name}`);
    return l;
  };
  if (c.scope === "bai") {
    if (!c.lessons.length) throw new Error("Chưa chọn bài nào");
    return c.lessons.map(timBai);
  }
  if (c.scope === "phan") {
    if (!c.lessons.length) throw new Error("Chưa chọn phần nào");
    const tenPhan = timBai(c.lessons[0]).part, p = COURSE.find(x => x.part === tenPhan);
    return p ? p.lessons.slice() : [timBai(c.lessons[0])];
  }
  if (c.scope === "tatca") return LESSONS.slice(0, NREAL);
  if (c.scope === "luyenthem") {
    if (WEAK.length) { luyenRounds = 1; buildLuyen(true); return [LUYEN]; }
    buildReview(true); return [REVIEW];
  }
  if (c.scope === "tugo") {
    /* Bài tạm từ nội dung tự gõ: mỗi dòng một dòng tập, dùng cỡ chữ và khoảng dòng của Bài tự do */
    const mau = LESSONS.find(l => l.id === "free") || {};
    const rows = c.text.split("\n").map(s => s.trim()).filter(Boolean).map(s => ["pair", s]);
    return [{ id: "tugo", t: "Nội dung tự gõ", part: "Tự gõ", z: mau.z || (SCRIPT === "th" ? "thuong" : "M"), up: mau.up, dn: mau.dn, note: "", rows }];
  }
  return [LESSONS.find(l => l.id === "free") || LESSONS[0]];   // "tudo"
}

async function exportPdf(cfg, tuyChon = {}) {
  const c = chuanHoaPdfCfg(cfg);
  const baoTienDo = typeof tuyChon.onProgress === "function" ? tuyChon.onProgress : () => {};
  pdfBusyFlag = true; exporting = true;

  /* Bộ vẽ còn đọc một số biến chung (khổ trang, giao diện, cài đặt). Tạm gán theo cfg rồi khôi phục nguyên vẹn. */
  const saveLR = luyenRounds, saveFL = frozenLuyen, saveFR = frozenReview, saveLRows = LUYEN.rows, saveRRows = REVIEW.rows;
  const saveTheme = S.theme, saveW = W, saveH = H, saveLayout = layout, saveT = T, saveSGrid = S.gridStyle, saveSArrows = S.rowArrows, saveSXBand = S.xBand, saveScale = S.scale, saveSTrace = S.trace;
  try {

    /* Trang nhỏ hơn A5 (dưới 1240 điểm ảnh ngang): thu nhỏ chữ tiêu đề và lề theo tỷ lệ; các khổ cũ giữ nguyên (k = 1) */

    S.gridStyle = c.grid; S.rowArrows = c.arrows; S.xBand = !pr.mono; S.trace = "dark";
    S.scale = pr.pxW >= 1500 ? 2.15 : 1.85;

    const padL = c.barSide === "left" ? pr.bar : px(68);
    const padR = c.barSide === "right" ? pr.bar : px(68);

    /* Tạo trước danh sách trang cho từng bài học */

    for (const l of targetLessons) {
      /* Tiểu học: thân chữ tính theo mm thật (1 ô li = 2 mm), các dòng 4 ô li nối liền nhau */
      const m = SCRIPT === "th" ? sizeForTHPdf(l, pr.pxW / pr.wMm) : sizeFor(l), F = m.F;
      let up = Math.max(l.up || F.asc + .25, F.asc + .05), dn = Math.max(l.dn || F.desc + .1, F.desc + .03);
      let unit = (up + dn) * m.fs + m.xh * (SCRIPT !== "td" ? .72 : .48);
      if (SCRIPT === "th") { const bd = thBuocDong(m.co, m.hoa); unit = bd.unit * m.fs; up = bd.up; }
      const perPage = Math.max(1, Math.floor((H - padT - padB) / unit));
      const avail = Math.max(200, W - padL - padR - 12);
      const rLayout = { m, padL, padR, padT, unit, perPage, up, safeSide: Math.min(padL, padR) };
      layout = rLayout;
      const lMode = l.id === "review" ? "nho" : c.mode;
      const groups = []; for (const r of lessonRows(l)) groups.push(...groupsFor(r, m, avail, lMode));
      if (l.id === "review") groups.forEach(g => g.forEach(row => { if (row.k === "hint") row.hide = 1 }));
      const lPages = []; let pg = [];
      for (const g of groups) {
        if (g.length > perPage) { if (pg.length) { lPages.push(pg); pg = [] } for (let k = 0; k < g.length; k += perPage) lPages.push(g.slice(k, k + perPage)); continue }
        if (pg.length + g.length > perPage && pg.length) { lPages.push(pg); pg = [] }
        pg.push(...g);
      }
      if (pg.length) lPages.push(pg);
      if (!lPages.length) lPages.push([]);

    const needToc = lessonJobs.length > 1;

    /* Tên nhóm bài ở trang mục lục và tên file: tên phần nếu mọi bài cùng một phần */
    const cungPhan = lessonJobs.every(j => j.lesson.part === lessonJobs[0].lesson.part);
    const tenNhom = c.scope === "tatca" ? "Cả giáo trình" : cungPhan ? lessonJobs[0].lesson.part : "Các bài đã chọn";

    const pdfPages = [];
    /* Trang 1: Mục lục có link bấm nhảy trang (cho reMarkable & Tablet) */
    if (needToc) {

      await new Promise(r => setTimeout(r, 10));
      ctx = new PdfCtx(doc, mctx);
      ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#000000"; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
      ctx.font = `700 ${px(46)}px 'QS',sans-serif`;
      ctx.fillText(`TẬP VIẾT · ${SC.name.toUpperCase()}`, padL, px(130));
      ctx.font = `500 ${px(28)}px 'QS',sans-serif`; ctx.fillStyle = "#444444";
      ctx.fillText(`${tenNhom}  ·  ${pr.name}${pr.links ? "  ·  Chạm vào bài để chuyển tới trang đó" : ""}`, padL, px(176));
      ctx.strokeStyle = "#000000"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(padL, px(202)); ctx.lineTo(W - padR, px(202)); ctx.stroke();

      const links = [];
      const rowH = Math.min(px(82), Math.floor((H - px(300)) / Math.max(1, lessonJobs.length)));
      lessonJobs.forEach((job, idx) => {
        const yTop = px(230) + idx * rowH, yBase = yTop + rowH * 0.66;
        ctx.fillStyle = idx % 2 === 0 ? "#F7F7F7" : "#FFFFFF";
        ctx.fillRect(padL, yTop, W - padL - padR, rowH - 8);
        ctx.strokeStyle = "#CCCCCC"; ctx.lineWidth = 1.5; ctx.strokeRect(padL, yTop, W - padL - padR, rowH - 8);
        ctx.fillStyle = "#000000"; ctx.font = `700 ${px(28)}px 'QS',sans-serif`; ctx.textAlign = "left";
        ctx.fillText(`${idx + 1}. ${job.lesson.t}`, padL + px(24), yBase);
        ctx.fillStyle = "#444444"; ctx.font = `600 ${px(24)}px 'QS',sans-serif`; ctx.textAlign = "right";
        ctx.fillText(`Trang ${job.startPageIdx + 1}${pr.links ? "  →" : ""}`, W - padR - px(24), yBase);
        /* Chuyển tọa độ sang PDF (gốc dưới trái) cho Annotation Link */

        if (pr.links) links.push({ rect: [x1, y1, x2, y2], targetPage: job.startPageIdx });
      });

      ctx.fillText(`Làm bằng ứng dụng Tập viết S Pen, bản ${APP_VER} · ${today()}`, W / 2, H - px(42));
      ctx.textAlign = "left";
      pdfPages.push({ content: ctx.out.join("\n"), links });
    }

    let donePages = 0;
    for (const job of lessonJobs) {
      layout = job.layout;
      const { m, unit, up } = layout;
      for (let pi = 0; pi < job.pages.length; pi++) {
        donePages++;
        baoTienDo(`Đang vẽ trang ${donePages}/${totalContentPages} (${job.lesson.t})…`);
        await new Promise(r => setTimeout(r, 8));
        ctx = new PdfCtx(doc, mctx);
        ctx.fillStyle = T.paper; ctx.fillRect(0, 0, W, H);
        /* Tiêu đề trang vở */
        ctx.fillStyle = "#000000"; ctx.textBaseline = "alphabetic"; ctx.textAlign = "left";
        ctx.font = `700 ${px(32)}px 'QS',sans-serif`;
        const liIdx = LESSONS.indexOf(job.lesson);
        const hTitle = liIdx >= 0 && liIdx < NREAL ? `Bài ${liIdx + 1} · ${job.lesson.t}` : job.lesson.t;
        ctx.fillText(hTitle, padL, px(66));
        ctx.font = `500 ${px(22)}px 'QS',sans-serif`; ctx.fillStyle = "#444444";
        ctx.fillText(`${SC.name} · ${job.lesson.id === "review" ? "Bài ôn" : c.mode === "to" ? "Tô" : "Chép"} · ${c.grid === "oly4" ? "4 ô li Việt Nam" : "Lưới xiên Pháp"}`, padL, px(100));
        ctx.textAlign = "right";
        ctx.fillText(`Trang ${donePages + tocOffset}/${totalContentPages + tocOffset}${needToc && pr.links ? "  ·  ↑ Mục lục" : ""}`, W - padR, px(66));
        ctx.textAlign = "left";
        ctx.strokeStyle = "#CCCCCC"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(padL, px(116)); ctx.lineTo(W - padR, px(116)); ctx.stroke();

        /* Vẽ dòng kẻ + chữ mẫu / tô / dấu chấm */
        const rows = job.pages[pi];
        /* Vẽ hết lưới trước rồi mới vẽ chữ: lưới dòng dưới không đè lên đuôi chữ, mũi tên dòng trên */
        if (SCRIPT === "th") {
          rows.forEach((row, ri) => guides(ctx, padT + ri * unit + up * m.fs, m, padL - 10, W - padR + 10, { dau: ri === 0, cuoi: ri === rows.length - 1 }));
          rows.forEach((row, ri) => drawRow(ctx, row, padT + ri * unit + up * m.fs, m, job.lesson.id === "review" ? "nho" : c.mode));

        if (job.lesson.cornell) { /* khung 3 ô: câu hỏi | ghi chép, tóm tắt ở dưới */

        pdfPages.push({ content: ctx.out.join("\n"), links: backLinks });
      }
    }

    baoTienDo("Đang tạo file PDF…");
    await new Promise(r => setTimeout(r, 10));
    const tieuDe = `Tập viết · ${SC.name} · ${lessonJobs.length > 1 ? tenNhom : lessonJobs[0].lesson.t}`;
    const blob = await assembleVectorPdf(doc, pdfPages, pr.ptW, pr.ptH, W, H, tieuDe);

/* ================== CẤU HÌNH VỞ TRONG ĐƯỜNG LINK ==================
   Dạng link: …/index.html#cfg=<mã>. Phần sau dấu # không được trình duyệt gửi lên máy chủ.
   Mã = chữ "z" + JSON nén (deflate-raw) viết theo base64url; trình duyệt không có CompressionStream
   thì dùng chữ "j" + JSON không nén. Cấu trúc cfg: docs/KIEN_TRUC.md mục 5.3. */
const LINK_CFG_TOI_DA = 8000;   // số ký tự tối đa của mã, chặn link quá dài hoặc bị sửa bậy

function b64urlTuByte(u8) {
  let s = ""; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function byteTuB64url(s) {
  const b = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
  const u8 = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u8[i] = b.charCodeAt(i);
  return u8;
}
async function quaLuong(u8, luong) {
  return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(luong)).arrayBuffer());
}

async function maHoaCfg(cfg) {
  const json = new TextEncoder().encode(JSON.stringify(cfg));
  if (typeof CompressionStream === "function") return "z" + b64urlTuByte(await quaLuong(json, new CompressionStream("deflate-raw")));
  return "j" + b64urlTuByte(json);
}

async function giaiMaCfg(ma) {
  if (typeof ma !== "string" || ma.length < 2 || ma.length > LINK_CFG_TOI_DA || !/^[zj][A-Za-z0-9_-]+$/.test(ma))
    throw new Error("Đường link cấu hình không hợp lệ");
  if (ma[0] === "z" && typeof DecompressionStream !== "function") throw new Error("Trình duyệt này chưa mở được link nén, hãy cập nhật trình duyệt");
  let cfg;
  try {
    let u8 = byteTuB64url(ma.slice(1));
    if (ma[0] === "z") u8 = await quaLuong(u8, new DecompressionStream("deflate-raw"));
    cfg = JSON.parse(new TextDecoder("utf-8", { fatal: true }).decode(u8));
  } catch (e) { throw new Error("Đường link cấu hình bị hỏng hoặc chép thiếu"); }
  if (!cfg || typeof cfg !== "object" || Array.isArray(cfg)) throw new Error("Đường link cấu hình không hợp lệ");
  return cfg;
}

async function duongLinkCfg(cfg) {
  return location.origin + location.pathname + "#cfg=" + await maHoaCfg(cfg);
}

/* Lúc mở app: link có #cfg= thì đổi kiểu chữ nếu cần (tải lại trang, giữ link),
   mở đúng bài rồi mở màn Xuất PDF đã điền sẵn tùy chọn. */
async function apDungCfgTuLink() {
  const m = location.hash.match(/^#cfg=([A-Za-z0-9_-]+)$/);
  if (!m) return;
  const boLink = () => window.history.replaceState(   // phải ghi window.: app có biến history riêng cho Hoàn tác
    null, "", location.pathname + location.search);
  let cfg;
  try { cfg = await giaiMaCfg(m[1]); }
  catch (e) { boLink(); toast(e.message); return; }
  if (cfg.script && cfg.script !== SCRIPT) {
    if (KIEU_CHU.includes(cfg.script)) { GS.set("script", cfg.script); location.reload(); return; }
    boLink(); toast(`Bản này chưa có kiểu chữ "${cfg.script}"`); return;
  }
  boLink();
  let c;
  try { c = chuanHoaPdfCfg(cfg); }
  catch (e) { toast("Không mở được cấu hình: " + e.message); return; }
  const id = c.lessons[0], i = id ? LESSONS.findIndex(l => l.id === id) : -1;
  if ((c.scope === "bai" || c.scope === "phan") && i >= 0 && i !== cur.li) openLesson(i);
  Object.assign(pdfOpt, {
    preset: c.preset, wMm: c.wMm, hMm: c.hMm, mode: c.mode, grid: c.grid, arrows: c.arrows, barSide: c.barSide,
    scope: c.scope === "bai" && c.lessons.length > 1 ? "pick" : { bai: "cur", phan: "part", tatca: "all", luyenthem: "weak", tudo: "free", tugo: "type" }[c.scope],
    lessons: c.lessons.slice(), text: c.text || "",
  });
  openPdfModal();
  toast("Đã mở cấu hình vở từ đường link");
}

/* Nút "Chép đường link cấu hình" trong màn Xuất PDF */
async function chepLinkCfg() {
  let link;
  try { link = await duongLinkCfg(pdfCfgTuManHinh()); }
  catch (e) { toast("Không tạo được đường link: " + e.message); return; }
  try { await navigator.clipboard.writeText(link); toast("Đã chép đường link cấu hình vở"); }
  catch (e) {
    const o = document.getElementById("pdfProg");
    if (o) { o.style.display = "block"; o.textContent = ""; const inp = document.createElement("input"); inp.value = link; inp.readOnly = true; inp.style.width = "100%"; o.appendChild(inp); inp.select(); }
    toast("Chưa chép tự động được, hãy chép đường link bên dưới");
  }
}

}
function openFavPop(){
  const h=`<div class="popT">Viết yêu thích</div><div class="favPick">${S.favs.map((f,idx)=>{const p=PEN_MAP[f.penType]||PEN_TYPES[0];
    return `<button class="${tool==="pen"&&S.activeFav===idx?"on":""}" onclick="closePop();useFav(${idx})"><span class="fc">${ic(p.ic)}<em style="background:${inkColor(f.color)}"></em></span>${f.name}</button>`}).join("")}</div>
  <button class="popBtn" onclick="closePop();penTap(true)">${ic("sliders")}Chỉnh viết, màu mực, cỡ nét</button>`;
  openPop("fav",h,document.getElementById("bPen"),"up");
}
(function(){const b=document.getElementById("bPen");let t=0,lp=false;
  b.addEventListener("pointerdown",()=>{lp=false;clearTimeout(t);t=setTimeout(()=>{lp=true;if(navigator.vibrate)try{navigator.vibrate(12)}catch(_){}openFavPop()},450)});
  for(const ev of["pointerup","pointerleave","pointercancel"])b.addEventListener(ev,()=>clearTimeout(t));
  b.addEventListener("click",()=>{if(lp){lp=false;return}penTap()});
})();
window.addEventListener("resize",closePop);

function placeToast(t){try{const r=document.getElementById("canvasWrap").getBoundingClientRect();
  const sheetOpen=!!document.querySelector(".sheet.open");
  if(sheetOpen||r.height<60){t.style.top="calc(env(safe-area-inset-top) + 14px)";t.style.left="50%";t.style.right="auto";t.style.transform="translateX(-50%)";return}
  t.style.transform="none";
  let minL=r.right;for(const id of["redoBtn","grade","cmp"]){const e=document.getElementById(id);if(e&&e.classList.contains("on")){const q=e.getBoundingClientRect();if(q.width)minL=Math.min(minL,S.leftHand?r.right:q.left)}}
  const room=minL-r.left-24;
  if(room>=200){t.style.maxWidth=Math.min(520,room)+"px";t.style.top=(r.top+6)+"px"}else{t.style.maxWidth=Math.min(520,r.width-24)+"px";t.style.top=(r.top+58)+"px"}
  if(S.leftHand){t.style.left="auto";t.style.right=(innerWidth-r.right+12)+"px"}else{t.style.right="auto";t.style.left=(r.left+12)+"px"}}catch(_){}}
/* ================== KHỞI ĐỘNG ================== */
function resize(){
  if(exporting){pendingResize=true;return}
  if(live)endStroke();if(zbox.live)endZBoxStroke();
  applySplit();
  const st=document.getElementById("canvasWrap").getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,3);W=Math.max(200,Math.floor(st.width));H=Math.max(120,Math.floor(st.height));
  for(const c of [bg,ink,fx]){c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px"}
  bctx=bg.getContext("2d");
  show();
  const card=document.getElementById("card");
  if(card&&card.classList.contains("open")&&animState.ch)(animState.mode==="quiz"?drawQuizFrame():drawAnimFrame());
}
let rT=0;window.addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(resize,150)});
document.addEventListener("contextmenu",e=>e.preventDefault());
(async()=>{
  try{await Promise.all([document.fonts.load("400 20px 'PS'","Tập viết ỡ Ổ"),document.fonts.load("400 20px 'AL'","Tập viết ỡ"),document.fonts.load("500 20px 'QS'","Aăâđ Tập viết ỡ")]);await document.fonts.ready}catch(e){}
  if(SCRIPT==="qs"&&!store.get("importedV3",false)){try{
    const od=localStorage.getItem("tv3:done"),oc=localStorage.getItem("tv3:custom");
    if(od&&!localStorage.getItem("qs1:done")){localStorage.setItem("qs1:done",od);done=new Set(JSON.parse(od))}
    if(oc&&!localStorage.getItem("qs1:custom"))localStorage.setItem("qs1:custom",oc);
    if(od||oc)setTimeout(()=>toast("Đã nhận tiến độ và bài tự do từ bản 3"),1200)}catch(e){}store.set("importedV3",true)}
  /* Đăng ký PWA Manifest động để cài lên màn hình chính Samsung Phone / Galaxy Tab */
  try{
    const mf={name:"Tập viết S Pen",short_name:"Tập viết",display:"standalone",background_color:"#F7F2E7",theme_color:"#F7F2E7"};
    const lk=document.createElement("link");lk.rel="manifest";lk.href="data:application/manifest+json,"+encodeURIComponent(JSON.stringify(mf));
    document.head.appendChild(lk);
  }catch(_){}
  if(!GS.get("v45Tip",false)){GS.set("v45Tip",true);setTimeout(()=>toast("Mẹo: mở ① Xem rồi chọn Tự tô từng nét để tập từng nét bằng S Pen"),3800)}
  if(!GS.get("v42Init",false)){S.favBar=false;saveS();GS.set("v42Init",true);setTimeout(()=>toast("Mẹo: nhấn giữ nút Viết để chọn nhanh viết yêu thích"),1800)}
  applyTheme();
  resize();
  if(paperDue()&&store.get("paperLast",null))setTimeout(()=>toast("Đã 2 tuần rồi — tới lúc kiểm tra chữ trên giấy (☰ → Công cụ → Kiểm tra trên giấy)"),2500);
  let ok=false;try{localStorage.setItem("td1:probe","1");ok=localStorage.getItem("td1:probe")==="1"}catch(e){}
  if(!ok)document.getElementById("warn").style.display="block";
  if(!store.get("seenGuide3",false)&&!location.hash.startsWith("#cfg=")){store.set("seenGuide3",true);setTimeout(openNhapMon,300)}
  apDungCfgTuLink();
})();
</script>
